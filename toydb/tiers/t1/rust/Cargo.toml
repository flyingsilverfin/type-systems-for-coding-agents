[package]
name = "toydb"
version = "1.0.0"
description = "A simple distributed SQL database, built for education"
authors = ["Erik Grinaker <erik@grinaker.me>"]
license = "Apache-2.0"
homepage = "https://github.com/erikgrinaker/toydb"
repository = "https://github.com/erikgrinaker/toydb"
edition = "2024"
publish = false

[lib]
doctest = false

[dependencies]
bincode = { version = "2.0", features = ["serde"] }
crossbeam = { version = "0.8", features = ["crossbeam-channel"] }
dyn-clone = "1.0"
itertools = "0.15"
log = "0.4"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"

[dev-dependencies]
goldenscript = "0.8"
hex = "0.4"
paste = "1.0"
serde_json = "1.0"
tempfile = "3.25"
test-case = "3.3"
test_each_file = "0.3"
